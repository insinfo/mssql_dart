name: mssql_dart
description: >-
  Pure Dart async driver for Microsoft SQL Server (TDS 7.4): binary RPC
  parameters, TLS with certificate validation and no native dependencies.
version: 1.0.0
repository: https://github.com/insinfo/mssql_dart
issue_tracker: https://github.com/insinfo/mssql_dart/issues
topics:
  - sql-server
  - mssql
  - database
  - tds
  - sql

# Self-signed certificate and key used only by the test server.
false_secrets:
  - /test/certificates/sqlserver.key

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  tlslite: ^1.0.0

dev_dependencies:
  test: ^1.26.3
